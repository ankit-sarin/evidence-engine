# The review's identity. The spec file is review_specs/<review_id>.yaml
# and the data root is data/<review_id>; neither is configured separately.
review_id: surgical_autonomy

title: "Autonomy in Surgical Robotics: A Systematic Review"
version: "1.0"
authors:
  - "Ankit Sarin, MD"
date: "2025-06-01"
prospero_id: null

pico:
  population: >-
    Studies involving autonomous or semi-autonomous surgical robotic systems
    performing physical surgical tasks on tissue, phantoms, or in-vivo models.
  intervention: >-
    Any level of surgical autonomy (Levels 1–5 per the Yang et al. taxonomy),
    ranging from robot assistance under continuous human control to fully
    autonomous task execution.
  comparator: >-
    Human-controlled (teleoperated) surgical systems, manual surgery,
    or no comparator.
  outcomes:
    - Task accuracy or error rate
    - Task completion time
    - Safety events (tissue damage, unplanned stops, collisions)
    - Autonomy level achieved (Yang et al. Level 1–5)
    - Surgeon workload or cognitive load metrics

search_strategy:
  databases:
    - PubMed
    - OpenAlex
  query_terms:
    - '("surgical robot" OR "robotic surgery" OR "surgical automation" OR "medical robot" OR "medical robotics" OR "robotic surgical")'
    - '("autonomous" OR "autonomy" OR "self-directed" OR "automated")'
  date_range: [2010, 2025]

unpaywall_email: "axsarin@health.ucdavis.edu"
# Proxy URL patterns vary by institution. Requires browser-level VPN/SSO to work.
# The manual download list also generates Google Scholar, Direct DOI, and PubMed links.
institutional_proxy_pattern: "https://doi-org.libproxy.ucdavis.edu/{doi}"

screening_models:
  primary: "qwen3:8b"
  verification: "gemma3:27b"

ft_screening_models:
  primary: "qwen3:32b"
  verifier: "gemma3:27b"
  think: false
  temperature: 0

low_yield_threshold: 4

pdf_quality_check:
  enabled: true
  ai_model: "qwen2.5vl:7b"
  dpi: 150
  timeout: 120
  exclude_reasons:
    - NON_ENGLISH
    - NOT_MANUSCRIPT
    - INACCESSIBLE
    - OTHER

# ── Eligibility (SCREEN-AUTH-01) ───────────────────────────────────
# Criteria, specialty scope, verifier tests and per-stage policy. Every screening
# prompt and adjudication sheet is rendered from this section by
# engine/core/eligibility_render.py. An exclusion's reason_code is the code a
# full-text decision records when that rule is the reason.
eligibility:
  criteria:
  - id: inc-english
    kind: inclusion
    text: English language
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: inc-original-research
    kind: inclusion
    text: Peer-reviewed original research (journal article or full conference paper)
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: inc-physical-task
    kind: inclusion
    text: Involves a physical surgical task (cadaver, phantom, animal, or human)
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: inc-autonomous-control
    kind: inclusion
    text: Must involve an autonomous or semi-autonomous robotic component that CONTROLS or DIRECTS a physical robot to execute a surgical action (not purely teleoperated or manual)
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: inc-simulation-conditional
    kind: inclusion
    text: Simulation studies included ONLY IF they demonstrate or evaluate autonomous/semi-autonomous robotic behavior in the simulation (not simulation frameworks, physics engines, or virtual environments described without autonomous robot behavior)
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: inc-date-range
    kind: inclusion
    text: Published between 2010 and 2025
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: exc-review-article
    kind: exclusion
    text: Systematic reviews, meta-analyses, or scoping reviews
    reason_code: review_article
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: exc-editorial
    kind: exclusion
    text: Editorials, commentaries, or letters to the editor
    reason_code: editorial_commentary
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: exc-abstract-only
    kind: exclusion
    text: Conference abstracts without full paper
    reason_code: abstract_only
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: exc-non-surgical-robotics
    kind: exclusion
    text: Non-surgical robotics (industrial, warehouse, rehabilitation, exoskeletons, prosthetics, assistive devices)
    reason_code: wrong_intervention
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: exc-teleoperation-only
    kind: exclusion
    text: Purely teleoperated/master-slave robotic surgery where the human directly controls all robot movements in real-time (e.g., standard da Vinci case series, joystick-controlled systems). There must be an autonomous or semi-autonomous component where the system makes independent decisions about motion, planning, or execution.
    reason_code: teleoperation_only
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: exc-analysis-only
    kind: exclusion
    text: ML/CV methodology papers that only analyze, classify, segment, track, or predict surgical data (video, images, sensor data) without controlling a robot to execute a surgical action
    examples:
    - 'planning-only papers — surgical motion, path, or task planning computed from data without controlling a robot to execute it'
    reason_code: analysis_only
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: exc-no-autonomy
    kind: exclusion
    text: Studies with no autonomous or semi-autonomous component
    examples:
    - hardware, sensor, or instrument papers that describe a robot or device without autonomous control
    reason_code: no_autonomy_content
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  - id: exc-insufficient-evidence
    kind: exclusion
    text: Papers with no abstract or insufficient information to determine eligibility — do not default to inclusion when evidence is absent
    reason_code: insufficient_data
    stages:
    - abstract_primary
    - abstract_verifier
    - ft_primary
    - ft_verifier
    - abstract_adjudication
    - ft_adjudication
  specialty_scope:
    id: specialty-scope
    reason_code: wrong_specialty
    included:
    - abdominal surgery
    - gynecologic surgery
    - urologic surgery
    - thoracic surgery
    - general surgery
    - head and neck surgery
    - bench/preclinical autonomy
    excluded:
    - dental surgery
    - oral and maxillofacial surgery
    - ophthalmic surgery
    - orthopedic surgery
    - dermatologic surgery
    - neurosurgery
    notes: |
      Papers describing bench/preclinical autonomous tasks (e.g., suturing, knot-tying on phantoms) are included regardless of the specialty context, as these represent generalizable autonomous capabilities. Orthopedic and neurosurgery papers are excluded only when the autonomous task is specialty-specific (e.g., autonomous bone drilling, stereotactic targeting). If the paper describes a generalizable autonomous task performed in an orthopedic or neurosurgical context, include it.
  verifier_tests:
  - id: vt-executes-action
    text: Does the {evidence} describe a robot that EXECUTES a surgical action autonomously or semi-autonomously? (Not just analysis/tracking/assessment)
    stages:
    - abstract_verifier
    - ft_verifier
    derives_from:
    - inc-autonomous-control
    - exc-analysis-only
  - id: vt-autonomous-component
    text: Is there an autonomous component — not purely teleoperated/master-slave?
    stages:
    - abstract_verifier
    - ft_verifier
    derives_from:
    - exc-teleoperation-only
    - exc-no-autonomy
  - id: vt-physical-task
    text: Does it involve a physical surgical task — not just a simulation framework or pure methodology?
    stages:
    - abstract_verifier
    - ft_verifier
    derives_from:
    - inc-physical-task
    - inc-simulation-conditional
  - id: vt-original-research
    text: Is it original research — not a review, editorial, or commentary?
    stages:
    - abstract_verifier
    derives_from:
    - inc-original-research
    - exc-review-article
    - exc-editorial
  - id: vt-specialty-in-scope
    text: Is the surgical specialty within scope (not dental, ophthalmic, etc. unless the task is a generalizable bench/preclinical autonomy task)?
    stages:
    - ft_verifier
    derives_from:
    - specialty-scope
  - id: vt-original-research-ft
    text: Is it original research with extractable data — not a protocol, review, or commentary?
    stages:
    - ft_verifier
    derives_from:
    - inc-original-research
    - exc-review-article
    - exc-editorial
  stage_policies:
    abstract_primary:
      when_uncertain: include
      when_evidence_absent: exclude
    abstract_verifier:
      when_uncertain: exclude
    ft_verifier:
      when_uncertain: exclude
